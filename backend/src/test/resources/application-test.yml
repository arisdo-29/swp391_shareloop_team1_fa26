# Profile test: datasource do Testcontainers cấp (@ServiceConnection / DynamicPropertySource),
# không khai báo datasource url ở đây.
spring:
  flyway:
    locations: classpath:db/migration
    out-of-order: false
  mail:
    host: localhost                 # chỉ để JavaMailSender khởi tạo được; test thay EmailSender bằng mock

# Không có SMTP thật khi test: nếu không tắt, /actuator/health thành DOWN (503) vì kiểm tra kết nối mail thất bại.
management:
  health:
    mail:
      enabled: false

app:
  # module auth (BE1)
  jwt:
    secret: test-only-secret-for-integration-tests-32-bytes
  # module auth / config (BE1)
  cors:
    allowed-origins: http://localhost:5173
  # module media (BE2)
  storage:
    type: local
  # module integration/ai (BE2)
  ai:
    enabled: false
