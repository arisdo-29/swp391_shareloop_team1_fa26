# Cấu hình dùng chung. Mỗi module một khối app.<module>;
# người sở hữu chỉ sửa trong khối của mình, thêm dòng ở cuối khối.
spring:
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 6MB
  application:
    name: shareloop
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate            # schema do Flyway quản lý
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration

server:
  port: 8080

app:
  # module auth (BE1)
  jwt:
    ttl-minutes: 120
  # module auth / config (BE1)
  cors: {}
  # module media (BE2)
  storage:
    type: local                     # local | s3; profile prod đọc từ STORAGE_TYPE
    local-dir: ./uploads            # chỉ dùng khi type = local
  # module integration/ai (BE2)
  ai:
    api-key: ${AI_API_KEY:}
  # module integration/payment (BE1)
  payment:
    mock:
      enabled: false                # bật endpoint mock-confirm (tự cộng Credit không cần tiền); chỉ bật ở dev, staging
  # module integration/mail (BE1)
  mail:
    from: no-reply@shareloop.local
  # job nền @Scheduled (BE1: listingfee, user); dev, prod chạy theo lịch, profile test đặt false
  jobs:
    enabled: true
