# Profile dev (máy cá nhân): kết nối dịch vụ của docker-compose.yml
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/shareloop
    username: shareloop
    password: shareloop
  flyway:
    locations: classpath:db/migration,classpath:db/dev-data
    out-of-order: true              # chỉ ở dev
  mail:
    host: localhost
    port: 1025

# module item: tài khoản test được bỏ qua giới hạn đăng bài (không có hiệu lực ở production)
shareloop:
  post-limit-bypass-emails:
    - tester1@shareloop.test
    - tester2@shareloop.test
  # Tạo sẵn 2 tài khoản trên (đã xác minh, không cần OTP). Mật khẩu chỉ dùng cho dev.
  seed-test-accounts:
    enabled: true
    password: ${SHARELOOP_SEEDTESTACCOUNTS_PASSWORD:Dev@12345}

app:
  # module auth (BE1)
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-32-bytes-min}
  # module auth / config (BE1)
  cors:
    allowed-origins: http://localhost:5173
  # module integration/payment (BE1)
  payment:
    mock:
      enabled: true
