# Profile prod: mọi thông tin kết nối và bí mật đọc từ biến môi trường,
# không có giá trị mặc định cho bí mật. Xem .env.example.
spring:
  # Giảm RAM cho Render 512 MB: chỉ tạo bean khi cần, tắt JMX
  main:
    lazy-initialization: true
  jmx:
    enabled: false
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 60000
  jpa:
    open-in-view: false
    properties:
      hibernate:
        query:
          plan_cache_max_size: 64
        default_batch_fetch_size: 20
  flyway:
    out-of-order: false
  mail:
    # Chỉ dùng khi MAIL_PROVIDER=smtp. Có giá trị mặc định để app vẫn khởi động khi gửi mail qua Brevo.
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

logging:
  level:
    org.hibernate.SQL: WARN

server:
  port: ${PORT:8080}                # Render cấp cổng qua biến PORT
  compression:
    enabled: false
  tomcat:
    threads:
      max: 20
      min-spare: 2
    accept-count: 20
  # Chạy sau proxy của nơi deploy: đọc IP thật của người dùng từ header X-Forwarded-For
  forward-headers-strategy: framework

management:
  health:
    mail:
      enabled: false                # không để /actuator/health báo DOWN vì không nối được SMTP

# Production không có tài khoản nào được bỏ qua giới hạn đăng bài
shareloop:
  post-limit-bypass-emails: []
  # Mặc định TẮT. Staging bật bằng SHARELOOP_SEEDTESTACCOUNTS_ENABLED=true và đặt SHARELOOP_SEEDTESTACCOUNTS_PASSWORD
  seed-test-accounts:
    enabled: false

app:
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  storage:
    type: ${STORAGE_TYPE}           # local | s3. Render free xoá ổ đĩa khi deploy lại → staging dùng s3
    s3:                             # chỉ cần khi STORAGE_TYPE=s3
      endpoint: ${S3_ENDPOINT:}     # R2: https://<account-id>.r2.cloudflarestorage.com
      region: ${S3_REGION:auto}     # R2 dùng auto
      bucket: ${S3_BUCKET:}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
  ai:
    api-key: ${OPENROUTER_API_KEY}
  payment:
    mock:
      enabled: ${PAYMENT_MOCK_ENABLED:false}  # staging đặt true để demo nạp giả lập; production để false
  # module integration/mail (BE1)
  mail:
    provider: ${MAIL_PROVIDER:smtp}  # smtp | brevo
    from: ${MAIL_FROM}
    brevo:
      api-key: ${BREVO_API_KEY:}
