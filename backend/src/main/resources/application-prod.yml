# Profile prod: mọi thông tin kết nối và bí mật đọc từ biến môi trường,
# không có giá trị mặc định cho bí mật. Xem .env.example.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    out-of-order: false
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

app:
  # module auth (BE1)
  jwt:
    secret: ${JWT_SECRET}
  # module auth / config (BE1)
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  # module media (BE2)
  storage:
    type: ${STORAGE_TYPE}           # local | s3
  # module integration/ai (BE2)
  ai:
    api-key: ${AI_API_KEY}
  # module integration/payment (BE1)
  payment:
    vnpay:
      tmn-code: ${VNPAY_TMN_CODE}
      hash-secret: ${VNPAY_HASH_SECRET}
