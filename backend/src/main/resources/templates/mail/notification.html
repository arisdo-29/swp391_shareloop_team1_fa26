<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{title}}</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f6f8;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f6f8;">
  <tr>
    <td align="center" style="padding:24px 12px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px; background-color:#ffffff; border-radius:8px; font-family:Arial, Helvetica, sans-serif; color:#1f2937;">
        <tr>
          <td style="padding:20px 24px; background-color:#1f7a5c; border-radius:8px 8px 0 0; color:#ffffff; font-size:20px; font-weight:bold;">ShareLoop</td>
        </tr>
        <tr>
          <td style="padding:24px; font-size:16px; line-height:1.6;">
            <h2 style="margin:0 0 16px; font-size:20px; color:#1f2937;">{{title}}</h2>
            <p style="margin:0 0 24px; white-space:pre-line;">{{content}}</p>
            <a href="{{link}}" style="display:inline-block; padding:12px 24px; background-color:#1f7a5c; border-radius:6px; color:#ffffff; font-weight:bold; text-decoration:none;">Xem chi tiết</a>
          </td>
        </tr>
        <tr>
          <td style="padding:16px 24px; border-top:1px solid #e5e7eb; color:#9ca3af; font-size:12px;">Đây là email tự động, vui lòng không trả lời.</td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
