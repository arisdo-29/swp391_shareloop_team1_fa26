# Lint + test + build frontend. Chay tren moi PR de dung lam
# "required check"; PR khong dong vao frontend/ thi bo qua cac buoc nang.
name: frontend
on:
  pull_request:
  push:
    branches: [develop, main]
jobs:
  frontend-build:
    name: frontend-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: PR co sua frontend khong
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE...HEAD" \
            | grep -qE '^(frontend/|\.github/workflows/frontend\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      # Node 24 theo engines trong frontend/package.json
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.run == 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Cai thu vien (npm ci)
        if: steps.changes.outputs.run == 'true'
        working-directory: frontend
        run: npm ci
      - name: Kiem tra ma nguon (ESLint)
        if: steps.changes.outputs.run == 'true'
        working-directory: frontend
        run: npm run lint
      - name: Kiem tra lop goi API
        if: steps.changes.outputs.run == 'true'
        working-directory: frontend
        run: npm run test:api
      - name: Chay test giao dien (Vitest)
        if: steps.changes.outputs.run == 'true'
        working-directory: frontend
        run: npx vitest run
      # npm run build da gom tsc -b nen kiem tra kieu luon o buoc nay
      - name: Build (tsc + Vite)
        if: steps.changes.outputs.run == 'true'
        working-directory: frontend
        run: npm run build
